pluginManagement {
  repositories {
    if (("true").equals(getProperty('useLocalRepo'))) {
      mavenLocal()
    }
    maven {
      credentials.username mavenUser
      credentials.password mavenPassword
      url repo
    }
    maven { // For UMLP Plugin
      credentials.username mavenUser
      credentials.password mavenPassword
      url = montigemrepo
    }
    gradlePluginPortal()
    mavenCentral()
  }
}

rootProject.name = 'Questionaire'
